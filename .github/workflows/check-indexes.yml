name: Check Indexes

on:
  pull_request:
    paths:
      - 'platform-tools/idi/**'
      - 'platform-tools/vm-builder/**'
      - 'vm-builder-templates/**'
      - 'scripts/generate_indexes.py'
      - 'docs/*-INDEX.*'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Check indexes are up to date
        run: python scripts/generate_indexes.py --no-cgc --check
