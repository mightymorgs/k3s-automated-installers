[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idi"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.1",
    "jinja2>=3.1.2",
    "jsonschema>=4.20.0",
    "click>=8.1.7",
    "rich>=13.7.0",
    "pydantic>=2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "inflect>=7.0",
    "nltk>=3.8",
    "ruamel-yaml>=0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
idi-generate = "idi.generation.generate_all:cli"
idi-download = "idi.generation.download_specs:cli"

[tool.setuptools.packages.find]
include = ["idi", "idi.*"]
