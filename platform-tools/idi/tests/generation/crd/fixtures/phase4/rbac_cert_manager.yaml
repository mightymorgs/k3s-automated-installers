# Golden fixture: cert-manager ClusterRole (simplified from real chart)
# Contains representative RBAC patterns for testing.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-manager-controller-certificates
rules:
  # Watch CRDs (operator trigger)
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates", "certificates/status", "certificaterequests", "certificaterequests/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["cert-manager.io"]
    resources: ["issuers", "clusterissuers"]
    verbs: ["get", "list", "watch"]
  # Create secrets (side-effect)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Read configmaps
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # Read services (for HTTP01 solver)
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  # Create events (infrastructure — should be filtered)
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Manage ingresses (for ACME HTTP01)
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingresses/finalizers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Coordination leases (infrastructure — should be filtered)
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-manager-controller-approve
rules:
  - apiGroups: ["cert-manager.io"]
    resources: ["signers"]
    verbs: ["approve"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["certificatesigningrequests", "certificatesigningrequests/status"]
    verbs: ["get", "list", "watch", "update"]
