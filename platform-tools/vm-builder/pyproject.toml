[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vm-builder"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.1",
    "jinja2>=3.1.2",
    "jsonschema>=4.20.0",
    "click>=8.1.7",
    "rich>=13.7.0",
    "pydantic>=2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
vm-builder = "vm_builder.cli:main"

[tool.setuptools.packages.find]
include = ["vm_builder", "vm_builder.*"]
